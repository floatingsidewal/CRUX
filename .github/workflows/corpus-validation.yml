name: Test Corpus Validation

on:
  push:
    branches: [main]
    paths:
      - 'crux/**'
      - 'rules/**'
      - 'test-corpus/**'
      - '.github/workflows/corpus-validation.yml'
  pull_request:
    paths:
      - 'crux/**'
      - 'rules/**'
      - 'test-corpus/**'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Minimum pass rate (0.0-1.0)'
        required: false
        default: '0.95'
      model_source:
        description: 'Model source (release/artifact/local)'
        required: false
        default: 'local'
  schedule:
    # Weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'

env:
  PYTHON_VERSION: '3.11'
  MIN_PASS_RATE: '0.95'

jobs:
  validate-corpus:
    name: Validate Scanner Against Test Corpus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # In case models are stored in LFS

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Azure CLI and Bicep
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az bicep install
          az bicep version

      - name: Install CRUX
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Check for trained model
        id: check-model
        run: |
          if [ -f "models/rf-baseline.pkl" ]; then
            echo "model_exists=true" >> $GITHUB_OUTPUT
            echo "Model found: models/rf-baseline.pkl"
          elif [ -f "models/ci-rf-minimal.pkl" ]; then
            echo "model_exists=true" >> $GITHUB_OUTPUT
            echo "model_path=models/ci-rf-minimal.pkl" >> $GITHUB_OUTPUT
            echo "CI model found: models/ci-rf-minimal.pkl"
          else
            echo "model_exists=false" >> $GITHUB_OUTPUT
            echo "No trained model found, will run rule-based validation only"
          fi

      - name: Download model from release (if configured)
        if: github.event.inputs.model_source == 'release' || (github.event_name != 'workflow_dispatch' && steps.check-model.outputs.model_exists != 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download latest --pattern '*.pkl' -D models/ || echo "No model in releases"

      - name: Run corpus validation
        id: validate
        run: |
          # Determine model path
          if [ -f "models/rf-baseline.pkl" ]; then
            MODEL_PATH="models/rf-baseline.pkl"
          elif [ -f "models/ci-rf-minimal.pkl" ]; then
            MODEL_PATH="models/ci-rf-minimal.pkl"
          else
            echo "::warning::No trained model available. Skipping ML validation."
            echo "skip_validation=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Using model: $MODEL_PATH"

          # Run validation
          crux validate-corpus \
            --model "$MODEL_PATH" \
            --rules rules/ \
            --corpus-dir test-corpus \
            --output validation-results.json \
            --min-pass-rate ${{ github.event.inputs.threshold || env.MIN_PASS_RATE }} || EXIT_CODE=$?

          # Extract metrics for output
          if [ -f "validation-results.json" ]; then
            PASS_RATE=$(jq -r '.summary.pass_rate // 0' validation-results.json)
            TOTAL_CASES=$(jq -r '.summary.total_cases // 0' validation-results.json)
            PASSED=$(jq -r '.summary.passed_cases // 0' validation-results.json)
            FAILED=$(jq -r '.summary.failed_cases // 0' validation-results.json)
            PRECISION=$(jq -r '.metrics.precision // 0' validation-results.json)
            RECALL=$(jq -r '.metrics.recall // 0' validation-results.json)
            F1=$(jq -r '.metrics.f1_score // 0' validation-results.json)

            echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
            echo "total_cases=$TOTAL_CASES" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "precision=$PRECISION" >> $GITHUB_OUTPUT
            echo "recall=$RECALL" >> $GITHUB_OUTPUT
            echo "f1_score=$F1" >> $GITHUB_OUTPUT
          fi

          exit ${EXIT_CODE:-0}

      - name: Generate validation summary
        if: steps.validate.outputs.skip_validation != 'true'
        run: |
          echo "## Corpus Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PASS_RATE="${{ steps.validate.outputs.pass_rate }}"
          if (( $(echo "$PASS_RATE >= ${{ env.MIN_PASS_RATE }}" | bc -l) )); then
            echo "### ✅ Validation Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Validation Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pass Rate | $(echo "scale=1; ${{ steps.validate.outputs.pass_rate }} * 100" | bc)% |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Cases | ${{ steps.validate.outputs.total_cases }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | ${{ steps.validate.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${{ steps.validate.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Precision | $(echo "scale=1; ${{ steps.validate.outputs.precision }} * 100" | bc)% |" >> $GITHUB_STEP_SUMMARY
          echo "| Recall | $(echo "scale=1; ${{ steps.validate.outputs.recall }} * 100" | bc)% |" >> $GITHUB_STEP_SUMMARY
          echo "| F1 Score | $(echo "scale=1; ${{ steps.validate.outputs.f1_score }} * 100" | bc)% |" >> $GITHUB_STEP_SUMMARY

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        if: always() && steps.validate.outputs.skip_validation != 'true'
        with:
          name: corpus-validation-results
          path: validation-results.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.validate.outputs.skip_validation != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const passRate = parseFloat('${{ steps.validate.outputs.pass_rate }}');
            const threshold = parseFloat('${{ env.MIN_PASS_RATE }}');
            const status = passRate >= threshold ? '✅' : '❌';

            const body = `## ${status} Corpus Validation Results

            | Metric | Value |
            |--------|-------|
            | **Pass Rate** | ${(passRate * 100).toFixed(1)}% |
            | Total Cases | ${{ steps.validate.outputs.total_cases }} |
            | Passed | ${{ steps.validate.outputs.passed }} |
            | Failed | ${{ steps.validate.outputs.failed }} |
            | Precision | ${(parseFloat('${{ steps.validate.outputs.precision }}') * 100).toFixed(1)}% |
            | Recall | ${(parseFloat('${{ steps.validate.outputs.recall }}') * 100).toFixed(1)}% |
            | F1 Score | ${(parseFloat('${{ steps.validate.outputs.f1_score }}') * 100).toFixed(1)}% |

            ${passRate < threshold ? `\n⚠️ **Pass rate ${(passRate * 100).toFixed(1)}% is below threshold ${(threshold * 100).toFixed(1)}%**` : ''}

            <details>
            <summary>View full validation report</summary>

            Download the \`corpus-validation-results\` artifact for detailed findings.
            </details>`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Corpus Validation Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # Run DLP validation on test corpus templates
  dlp-validation:
    name: DLP Check on Test Corpus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install CRUX
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install Presidio (optional)
        continue-on-error: true
        run: |
          pip install presidio-analyzer presidio-anonymizer
          python -m spacy download en_core_web_sm || echo "Using regex-only DLP mode"

      - name: Run DLP validation on corpus
        run: |
          echo "## DLP Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ISSUES_FOUND=0

          for template in $(find test-corpus -name "*.bicep" -o -name "*.json" | grep -v expected.json | grep -v manifest.json | grep -v submission.json); do
            echo "Checking: $template"

            # Run DLP check with Azure-only mode
            python -c "
            from crux.corpus import TemplateDLPValidator, DLPValidationLevel
            from pathlib import Path

            validator = TemplateDLPValidator(
                validation_level=DLPValidationLevel.MODERATE,
                azure_only_endpoints=True
            )
            content = Path('$template').read_text()
            result = validator.validate(content)

            if result.critical_findings:
                print('CRITICAL: Found sensitive data')
                for f in result.critical_findings:
                    print(f'  - {f.entity_type}: {f.redacted_text}')
                exit(1)
            elif result.blocking_findings:
                print('WARNING: Found potential PII')
                for f in result.blocking_findings[:3]:
                    print(f'  - {f.entity_type}: {f.redacted_text}')
            else:
                print('OK: No sensitive data detected')
            " || ISSUES_FOUND=$((ISSUES_FOUND + 1))
          done

          if [ $ISSUES_FOUND -gt 0 ]; then
            echo "⚠️ Found $ISSUES_FOUND templates with potential DLP issues" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All templates passed DLP validation" >> $GITHUB_STEP_SUMMARY
          fi
